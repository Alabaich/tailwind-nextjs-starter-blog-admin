name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: admin
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: admin
        run: npm run build

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q
