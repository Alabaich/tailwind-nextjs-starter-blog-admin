version: 2
updates:
  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /deployer
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/admin, /deployer, /blog]
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
